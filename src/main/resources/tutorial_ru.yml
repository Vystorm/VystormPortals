title: 'Порталы'
pages:
  - title: 'Построить портал'
    gif: "tutorial/build.gif"
    text: |
      Встаньте на место портала и создайте его через /vportal (или /portal). Свяжите два портала — и увидите другую сторону.
  - title: 'Доступ и доверие'
    gif: "tutorial/access.gif"
    text: |
      Откройте портал всем или оставьте личным для доверенных игроков. Порталы Незера и Энда тоже показывают другую сторону.
      Введите /vportal help, чтобы увидеть все команды.
  - title: 'Порталы домой и к варпам'
    gif: "tutorial/gates.gif"
    text: |
      Установи дом командой /sethome и открой к нему портал командой /home. В стене перед тобой (или на открытом месте) появится портал размером с дверь с видом на цель – войди в него за 10 секунд. /warp ИМЯ открывает портал к варпу сервера, за тобой могут пойти друзья. С энергией порталов дальние путешествия стоят дороже, а энергия со временем восстанавливается (/vportal energy).
