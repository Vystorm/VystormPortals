        "zh_cn": "穿过下界传送门时取消等待？"
      },
      "type": "choice",
      "recommended": "on",
      "options": [
        {
          "id": "on",
          "label": {
            "en": "On",
            "de": "An",
            "fr": "Activé",
            "it": "Attivo",
