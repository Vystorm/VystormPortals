# /vportal through Vystorm Core: description, help and tab completion per player. "aliases" under commands.vportal are
# extra root commands (server-wide, the admin chooses which languages: Core config commands.localized-aliases); "name"
# and "aliases" of a subcommand are accepted in every language, English always works.
commands:
  vportal:
    description: "Linked portals: list, menu, create, link, access, warmup and trusted players"
    aliases: []
    values:
      public: public
      private: private
    sub:
      list:
        name: list
        aliases: []
        description: "Portals you may use and their targets"
      trip:
        name: trip
        aliases: []
        description: "Save, preview and follow a multi-stop portal itinerary"
        args:
          action: "ACTION"
      nearby:
        name: nearby
        aliases: []
        description: "Find the nearest accessible portals in your world"
      menu:
        name: menu
        aliases: []
        description: "Open the portal menu"
      info:
        name: info
        aliases: []
        description: "Position, size, access, warmup, target and owner of a portal"
        args:
          name: PORTAL
      create:
        name: create
        aliases: []
        description: "Create a portal where you stand, facing you (2-8 blocks, default 3x3)"
        args:
          name: NAME
          width: WIDTH
          height: HEIGHT
      link:
        name: link
        aliases: []
        description: "Link two of your portals both ways"
        args:
          name: PORTAL
          target: TARGET
      unlink:
        name: unlink
        aliases: []
        description: "Remove the link of a portal"
        args:
          name: PORTAL
      delete:
        name: delete
        aliases: []
        description: "Delete a portal"
        args:
          name: PORTAL
      access:
        name: access
        aliases: []
        description: "Open a portal to everyone or only to you and trusted players"
        args:
          name: PORTAL
      warmup:
        name: warmup
        aliases: []
        description: "Ticks a player waits in the portal before travelling"
        args:
          name: PORTAL
          ticks: TICKS
      trust:
        name: trust
        aliases: []
        description: "Let a player use a private portal; without a player: show the list"
        args:
          name: PORTAL
          player: PLAYER
      untrust:
        name: untrust
        aliases: []
        description: "Take a player's access to a private portal back"
        args:
          name: PORTAL
          player: PLAYER
      rename:
        name: rename
        aliases: []
        description: "Give a portal a new name; its link follows"
        args:
          name: PORTAL
          newname: NEW_NAME

      pause:
        name: pause
        aliases: []
        description: "Pause a portal for maintenance without removing its link"
        args:
          name: PORTAL

      resume:
        name: resume
        aliases: []
        description: "Reopen a paused portal"
        args:
          name: PORTAL

      home:
        name: home
        aliases: []
        description: "Open a gate to one of your homes"
        args:
          home: "HOME"

      sethome:
        name: sethome
        aliases: []
        description: "Set a home where you stand"
        args:
          home: "HOME"

      delhome:
        name: delhome
        aliases: []
        description: "Delete a home"
        args:
          home: "HOME"

      homes:
        name: homes
        aliases: []
        description: "List your homes"

      warp:
        name: warp
        aliases: []
        description: "Open a gate to a warp"
        args:
          warp: "WARP"

      setwarp:
        name: setwarp
        aliases: []
        description: "Set a warp where you stand (admins)"
        args:
          warp: "WARP"

      delwarp:
        name: delwarp
        aliases: []
        description: "Delete a warp (admins)"
        args:
          warp: "WARP"

      warps:
        name: warps
        aliases: []
        description: "List the warps"

      energy:
        name: energy
        aliases: []
        description: "Show your portal energy"
      import:
        name: import
        aliases: []
        description: "Copy homes and warps from HuskHomes (admins)"
        args:
          source: SOURCE
  home:
    description: "Open a gate to one of your homes"
    aliases: []
    args:
      home: "HOME"
  sethome:
    description: "Set a home where you stand"
    aliases: []
    args:
      home: "HOME"
  delhome:
    description: "Delete a home"
    aliases: []
    args:
      home: "HOME"
  homes:
    description: "List your homes"
    aliases: []
  warp:
    description: "Open a gate to a warp"
    aliases: []
    args:
      warp: "WARP"
  setwarp:
    description: "Set a warp where you stand (admins)"
    aliases: []
    args:
      warp: "WARP"
  delwarp:
    description: "Delete a warp (admins)"
    aliases: []
    args:
      warp: "WARP"
  warps:
    description: "List the warps"
    aliases: []
