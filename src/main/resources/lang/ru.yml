commands:
  vportal:
    description: 'Связанные порталы: список, меню, создание, ссылка, доступ, разминка и доверенные игроки'
    aliases: []
    values:
      public: общий
      private: личный
    sub:
      list:
        name: list
        aliases: []
        description: Порталы, которые вы можете использовать, и их цели
      trip:
        name: trip
        aliases: []
        description: "Сохранить, просмотреть и пройти маршрут через несколько порталов"
        args:
          action: "ACTION"
      nearby:
        name: nearby
        aliases: []
        description: Найдите ближайшие доступные порталы в вашем мире
      menu:
        name: menu
        aliases: []
        description: Откройте меню портала
      info:
        name: info
        aliases: []
        description: Положение, размер, доступ, разминка, цель и владелец портала
        args:
          name: PORTAL
      create:
        name: create
        aliases: []
        description: Создайте портал, где вы стоите, лицом к вам (2-8 блоков, по умолчанию 3x3)
        args:
          name: NAME
          width: WIDTH
          height: HEIGHT
      link:
        name: link
        aliases: []
        description: Свяжите два своих портала в обе стороны
        args:
          name: PORTAL
          target: TARGET
      unlink:
        name: unlink
        aliases: []
        description: Удалить ссылку на портал
        args:
          name: PORTAL
      delete:
        name: delete
        aliases: []
        description: Удалить портал
        args:
          name: PORTAL
      access:
        name: access
        aliases: []
        description: Откройте портал для всех или только для вас и доверенных игроков
        args:
          name: PORTAL
      warmup:
        name: warmup
        aliases: []
        description: Игрок ждет на портале перед поездкой
        args:
          name: PORTAL
          ticks: TICKS
      trust:
        name: trust
        aliases: []
        description: 'Разрешите игроку использовать частный портал; без игрока: покажите список'
        args:
          name: PORTAL
          player: PLAYER
      untrust:
        name: untrust
        aliases: []
        description: Верните доступ игрока к частному порталу
        args:
          name: PORTAL
          player: PLAYER
      rename:
        name: rename
        aliases: []
        description: Дайте порталу новое имя; его ссылка следует
        args:
          name: PORTAL
          newname: NEW_NAME
      pause:
        name: pause
        aliases: []
        description: Приостановить работу портала для обслуживания без удаления его ссылки
        args:
          name: PORTAL
      resume:
        name: resume
        aliases: []
        description: Открыть приостановленный портал
        args:
          name: PORTAL

      home:
        name: home
        aliases: []
        description: "Открыть портал к одному из твоих домов"
        args:
          home: "ДОМ"

      sethome:
        name: sethome
        aliases: []
        description: "Установить дом здесь"
        args:
          home: "ДОМ"

      delhome:
        name: delhome
        aliases: []
        description: "Удалить дом"
        args:
          home: "ДОМ"

      homes:
        name: homes
        aliases: []
        description: "Список твоих домов"

      warp:
        name: warp
        aliases: []
        description: "Открыть портал к варпу"
        args:
          warp: "ВАРП"

      setwarp:
        name: setwarp
        aliases: []
        description: "Установить варп здесь (админы)"
        args:
          warp: "ВАРП"

      delwarp:
        name: delwarp
        aliases: []
        description: "Удалить варп (админы)"
        args:
          warp: "ВАРП"

      warps:
        name: warps
        aliases: []
        description: "Список варпов"

      energy:
        name: energy
        aliases: []
        description: "Показать энергию порталов"
      import:
        name: import
        aliases: []
        description: "Перенести дома и варпы из HuskHomes (админы)"
        args:
          source: SOURCE
