commands:
  vportal:
    description: 'Portais ligados: lista, menu, criação, link, acesso, aquecimento e jogadores de confiança'
    aliases: []
    values:
      public: público
      private: privado
    sub:
      list:
        name: list
        aliases: []
        description: Portais que você pode usar e seus alvos
      trip:
        name: trip
        aliases: []
        description: "Salvar, visualizar e seguir um itinerário com vários portais"
        args:
          action: "ACTION"
      nearby:
        name: nearby
        aliases: []
        description: Encontre os portais mais acessíveis do seu mundo
      menu:
        name: menu
        aliases: []
        description: Abra o menu do portal
      info:
        name: info
        aliases: []
        description: Posição, tamanho, acesso, aquecimento, alvo e proprietário de um portal
        args:
          name: PORTAL
      create:
        name: create
        aliases: []
        description: Crie um portal onde você está, de frente para você (2-8 blocos, padrão 3x3)
        args:
          name: NAME
          width: WIDTH
          height: HEIGHT
      link:
        name: link
        aliases: []
        description: Ligue dois de seus portais para ambos os lados
        args:
          name: PORTAL
          target: TARGET
      unlink:
        name: unlink
        aliases: []
        description: Remova a ligação de um portal
        args:
          name: PORTAL
      delete:
        name: delete
        aliases: []
        description: Delete um portal
        args:
          name: PORTAL
      access:
        name: access
        aliases: []
        description: Abra um portal para todos ou apenas para você e jogadores de confiança
        args:
          name: PORTAL
      warmup:
        name: warmup
        aliases: []
        description: Um jogador espera no portal antes de viajar
        args:
          name: PORTAL
          ticks: TICKS
      trust:
        name: trust
        aliases: []
        description: 'Deixe um jogador usar um portal privado; sem um jogador: mostre a lista'
        args:
          name: PORTAL
          player: PLAYER
      untrust:
        name: untrust
        aliases: []
        description: Pegue o acesso de um jogador a um portal privado de volta
        args:
          name: PORTAL
          player: PLAYER
      rename:
        name: rename
        aliases: []
        description: Dê a um portal um novo nome, seu link segue
        args:
          name: PORTAL
          newname: NEW_NAME
      pause:
        name: pause
        aliases: []
        description: Pause um portal para manutenção sem remover sua ligação
        args:
          name: PORTAL
      resume:
        name: resume
        aliases: []
        description: Reabra um portal parado
        args:
          name: PORTAL

      home:
        name: home
        aliases: []
        description: "Abrir um portal para uma das suas casas"
        args:
          home: "CASA"

      sethome:
        name: sethome
        aliases: []
        description: "Definir uma casa aqui"
        args:
          home: "CASA"

      delhome:
        name: delhome
        aliases: []
        description: "Apagar uma casa"
        args:
          home: "CASA"

      homes:
        name: homes
        aliases: []
        description: "Listar suas casas"

      warp:
        name: warp
        aliases: []
        description: "Abrir um portal para um warp"
        args:
          warp: "WARP"

      setwarp:
        name: setwarp
        aliases: []
        description: "Definir um warp aqui (admins)"
        args:
          warp: "WARP"

      delwarp:
        name: delwarp
        aliases: []
        description: "Apagar um warp (admins)"
        args:
          warp: "WARP"

      warps:
        name: warps
        aliases: []
        description: "Listar os warps"

      energy:
        name: energy
        aliases: []
        description: "Mostrar sua energia de portal"
      import:
        name: import
        aliases: []
        description: "Copiar homes e warps do HuskHomes (admins)"
        args:
          source: SOURCE
  home:
