commands:
  vportal:
    description: 'Portails liés : liste, menu, création, lien, accès, échauffement et joueurs de confiance'
    aliases: []
    values:
      public: public
      private: privé
    sub:
      list:
        name: list
        aliases: []
        description: Portails que vous pouvez utiliser et leurs cibles
      trip:
        name: trip
        aliases: []
        description: "Enregistrer, consulter et suivre un parcours à plusieurs portails"
        args:
          action: "ACTION"
      nearby:
        name: nearby
        aliases: []
        description: Trouvez les portails accessibles les plus proches dans votre monde
      menu:
        name: menu
        aliases: []
        description: Ouvrir le menu du portail
      info:
        name: info
        aliases: []
        description: Position, taille, accès, échauffement, cible et propriétaire d'un portail
        args:
          name: PORTAL
      create:
        name: create
        aliases: []
        description: Créez un portail où vous êtes debout, face à vous (2-8 blocs, par défaut 3x3)
        args:
          name: NAME
          width: WIDTH
          height: HEIGHT
      link:
        name: link
        aliases: []
        description: Relier deux de vos portails de deux façons
        args:
          name: PORTAL
          target: TARGET
      unlink:
        name: unlink
        aliases: []
        description: Supprimer le lien d'un portail
        args:
          name: PORTAL
      delete:
        name: delete
        aliases: []
        description: Supprimer un portail
        args:
          name: PORTAL
      access:
        name: access
        aliases: []
        description: Ouvrir un portail à tout le monde ou seulement à vous et aux joueurs de confiance
        args:
          name: PORTAL
      warmup:
        name: warmup
        aliases: []
        description: Clique sur un joueur qui attend dans le portail avant de voyager
        args:
          name: PORTAL
          ticks: TICKS
      trust:
        name: trust
        aliases: []
        description: 'Laissez un joueur utiliser un portail privé ; sans lecteur : affichez la liste'
        args:
          name: PORTAL
          player: PLAYER
      untrust:
        name: untrust
        aliases: []
        description: Reprenez l'accès d'un joueur à un portail privé
        args:
          name: PORTAL
          player: PLAYER
      rename:
        name: rename
        aliases: []
        description: Donnez un nouveau nom à un portail; son lien suit
        args:
          name: PORTAL
          newname: NEW_NAME
      pause:
        name: pause
        aliases: []
        description: Pause un portail pour la maintenance sans supprimer son lien
        args:
          name: PORTAL
      resume:
        name: resume
        aliases: []
        description: Réouvrir un portail en pause
        args:
          name: PORTAL

