# 通过 Vystorm Core 提供的 /vportal：每位玩家看到自己语言的说明、帮助和 Tab 补全。commands.vportal 下的 "aliases" 是额外的
# 主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name" 和 "aliases"
# 在所有语言中都可使用，英文始终有效。
commands:
  vportal:
    description: "相连的传送门：列表、菜单、创建、连接、访问权限、预热时间和受信任玩家"
    aliases: [传送门]
    values:
      public: 公开
      private: 私有
    sub:
      list:
        name: 列表
        aliases: []
        description: "你可以使用的传送门及其目标"
      trip:
        name: 旅程
        aliases: []
        description: "保存、预览并使用多站传送门路线"
        args:
          action: "ACTION"
      nearby:
        name: 附近
        aliases: []
        description: "寻找当前世界中附近可使用的传送门"
      menu:
        name: 菜单
        aliases: []
        description: "打开传送门菜单"
      info:
        name: 信息
        aliases: []
        description: "传送门的位置、大小、访问权限、预热时间、目标和所有者"
        args:
          name: 传送门
      create:
        name: 创建
        aliases: []
        description: "在你站立处面向你创建传送门（2-8 格，默认 3x3）"
        args:
          name: 名称
          width: 宽度
          height: 高度
      link:
        name: 连接
        aliases: []
        description: "双向连接你的两个传送门"
        args:
          name: 传送门
          target: 目标
      unlink:
        name: 断开
        aliases: []
        description: "解除传送门的连接"
        args:
          name: 传送门
      delete:
        name: 删除
        aliases: []
        description: "删除传送门"
        args:
          name: 传送门
      access:
        name: 访问
        aliases: []
        description: "向所有人开放传送门，或仅限你和受信任玩家"
        args:
          name: 传送门
      warmup:
        name: 预热
        aliases: []
        description: "玩家在传送门中等待多少刻后出发"
        args:
          name: 传送门
          ticks: 刻数
      trust:
        name: 信任
        aliases: []
        description: "允许某位玩家使用私有传送门；不指定玩家则显示列表"
        args:
          name: 传送门
          player: 玩家
      untrust:
        name: 取消信任
        aliases: []
        description: "收回某位玩家对私有传送门的访问权限"
        args:
          name: 传送门
          player: 玩家
      rename:
        name: 重命名
        aliases: []
        description: "给传送门改名；连接保持不变"
        args:
          name: 传送门
          newname: 新名称

      pause:
        name: 暂停
        aliases: []
        description: "暂停传送门以进行维护，保留连接"
        args:
          name: 传送门

      resume:
        name: 恢复
        aliases: []
        description: "重新开放已暂停的传送门"
        args:
          name: 传送门

      home:
        name: 家
        aliases: []
        description: "打开通往你的家的传送门"
        args:
          home: "家"

      sethome:
        name: 设置家
        aliases: []
        description: "在此处设置家"
        args:
          home: "家"

      delhome:
        name: 删除家
        aliases: []
        description: "删除一个家"
        args:
          home: "家"

      homes:
        name: 家列表
        aliases: []
        description: "列出你的家"

      warp:
        name: 传送点
        aliases: []
        description: "打开通往传送点的传送门"
        args:
          warp: "传送点"

      setwarp:
        name: 设置传送点
        aliases: []
        description: "在此处设置传送点（管理员）"
        args:
          warp: "传送点"

      delwarp:
        name: 删除传送点
        aliases: []
        description: "删除传送点（管理员）"
        args:
          warp: "传送点"

      warps:
        name: 传送点列表
        aliases: []
        description: "列出传送点"

      energy:
        name: 能量
        aliases: []
        description: "显示你的传送门能量"
      import:
        name: 导入
        aliases: []
        description: "从 HuskHomes 导入家和传送点（管理员）"
        args:
          source: SOURCE
  home:
    description: "打开通往你的家的传送门"
    aliases: []
    args:
      home: "家"
  sethome:
    description: "在此处设置家"
    aliases: []
    args:
      home: "家"
  delhome:
    description: "删除一个家"
    aliases: []
    args:
      home: "家"
  homes:
    description: "列出你的家"
    aliases: []
  warp:
    description: "打开通往传送点的传送门"
    aliases: []
    args:
      warp: "传送点"
  setwarp:
    description: "在此处设置传送点（管理员）"
    aliases: []
    args:
      warp: "传送点"
  delwarp:
    description: "删除传送点（管理员）"
    aliases: []
    args:
      warp: "传送点"
  warps:
    description: "列出传送点"
    aliases: []
