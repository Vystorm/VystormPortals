commands:
  vportal:
    description: 'Portali collegati: elenco, menu, creare, link, accesso, riscaldamento e giocatori fidati'
    aliases: []
    values:
      public: pubblico
      private: privato
    sub:
      list:
        name: list
        aliases: []
        description: Portali che puoi usare e i loro obiettivi
      trip:
        name: trip
        aliases: []
        description: "Salva, visualizza e percorri un itinerario con più portali"
        args:
          action: "ACTION"
      nearby:
        name: nearby
        aliases: []
        description: Trova i portali più vicini nel tuo mondo
      menu:
        name: menu
        aliases: []
        description: Aprire il menu del portale
      info:
        name: info
        aliases: []
        description: Posizione, dimensione, accesso, riscaldamento, destinazione e proprietario di un portale
        args:
          name: PORTAL
      create:
        name: create
        aliases: []
        description: Crea un portale dove ti trovi, di fronte a te (2-8 blocchi, default 3x3)
        args:
          name: NAME
          width: WIDTH
          height: HEIGHT
      link:
        name: link
        aliases: []
        description: Link due dei tuoi portali entrambi i modi
        args:
          name: PORTAL
          target: TARGET
      unlink:
        name: unlink
        aliases: []
        description: Rimuovi il link di un portale
        args:
          name: PORTAL
      delete:
        name: delete
        aliases: []
        description: Eliminare un portale
        args:
          name: PORTAL
      access:
        name: access
        aliases: []
        description: Aprire un portale a tutti o solo a voi e giocatori fidati
        args:
          name: PORTAL
      warmup:
        name: warmup
        aliases: []
        description: Ticks un giocatore aspetta nel portale prima di viaggiare
        args:
          name: PORTAL
          ticks: TICKS
      trust:
        name: trust
        aliases: []
        description: 'Lascia che un giocatore utilizzi un portale privato; senza un giocatore: mostra l''elenco'
        args:
          name: PORTAL
          player: PLAYER
      untrust:
        name: untrust
        aliases: []
        description: Porta indietro l'accesso di un giocatore a un portale privato
        args:
          name: PORTAL
          player: PLAYER
      rename:
        name: rename
        aliases: []
        description: Dare a un portale un nuovo nome; il suo link segue
        args:
          name: PORTAL
          newname: NEW_NAME
      pause:
        name: pause
        aliases: []
        description: Utilizzare un portale per la manutenzione senza rimuovere il suo link
        args:
          name: PORTAL
      resume:
        name: resume
        aliases: []
        description: Riaprire un portale in pausa
        args:
          name: PORTAL

      home:
        name: home
        aliases: []
        description: "Apri un portale verso una delle tue case"
        args:
          home: "CASA"

      sethome:
        name: sethome
        aliases: []
        description: "Imposta una casa qui"
        args:
          home: "CASA"

      delhome:
        name: delhome
        aliases: []
        description: "Elimina una casa"
        args:
          home: "CASA"

      homes:
        name: homes
        aliases: []
        description: "Elenca le tue case"

      warp:
        name: warp
        aliases: []
        description: "Apri un portale verso un warp"
        args:
          warp: "WARP"

      setwarp:
        name: setwarp
        aliases: []
        description: "Imposta un warp qui (admin)"
        args:
          warp: "WARP"

      delwarp:
        name: delwarp
        aliases: []
        description: "Elimina un warp (admin)"
        args:
          warp: "WARP"

      warps:
        name: warps
        aliases: []
        description: "Elenca i warp"

      energy:
        name: energy
        aliases: []
        description: "Mostra la tua energia del portale"
      import:
        name: import
        aliases: []
        description: "Copia home e warp da HuskHomes (admin)"
        args:
          source: SOURCE
