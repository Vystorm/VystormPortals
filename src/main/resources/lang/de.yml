# /vportal über Vystorm Core: Beschreibung, Hilfe und Tab-Vervollständigung je Spieler. "aliases" unter commands.vportal
# sind zusätzliche Hauptbefehle (serverweit, der Admin wählt die Sprachen: Core-Konfig commands.localized-aliases);
# "name" und "aliases" eines Unterbefehls werden in jeder Sprache verstanden, Englisch geht immer.
commands:
  vportal:
    description: "Verbundene Portale: Liste, Menü, anlegen, verbinden, Zugang, Wartezeit und vertraute Spieler"
    aliases: [portale]
    values:
      public: öffentlich
      private: privat
    sub:
      list:
        name: liste
        aliases: []
        description: "Portale, die du benutzen darfst, und ihre Ziele"
      trip:
        name: reise
        aliases: []
        description: "Portalreisen mit mehreren Halten speichern, ansehen und durchführen"
        args:
          action: "ACTION"
      nearby:
        name: umgebung
        aliases: []
        description: "Nahe erreichbare Portale in deiner Welt finden"
      menu:
        name: menü
        aliases: [menue]
        description: "Portalmenü öffnen"
      info:
        name: info
        aliases: []
        description: "Position, Größe, Zugang, Wartezeit, Ziel und Besitzer eines Portals"
        args:
          name: PORTAL
      create:
        name: erstellen
        aliases: [anlegen]
        description: "Portal dort anlegen, wo du stehst, dir zugewandt (2-8 Blöcke, Standard 3x3)"
        args:
          name: NAME
          width: BREITE
          height: HÖHE
      link:
        name: verbinden
        aliases: []
        description: "Zwei deiner Portale in beide Richtungen verbinden"
        args:
          name: PORTAL
          target: ZIEL
      unlink:
        name: trennen
        aliases: []
        description: "Verbindung eines Portals lösen"
        args:
          name: PORTAL
      delete:
        name: entfernen
        aliases: []
        description: "Portal entfernen"
        args:
          name: PORTAL
      access:
        name: zugang
        aliases: []
        description: "Portal für alle öffnen oder nur für dich und vertraute Spieler"
        args:
          name: PORTAL
      warmup:
        name: wartezeit
        aliases: []
        description: "Ticks, die ein Spieler im Portal wartet, bevor er reist"
        args:
          name: PORTAL
          ticks: TICKS
      trust:
        name: vertrauen
        aliases: []
        description: "Einen Spieler ein privates Portal benutzen lassen; ohne Spieler: Liste zeigen"
        args:
          name: PORTAL
          player: SPIELER
      untrust:
        name: entziehen
        aliases: []
        description: "Einem Spieler den Zugang zu einem privaten Portal wieder nehmen"
        args:
          name: PORTAL
          player: SPIELER
      rename:
        name: umbenennen
        aliases: []
        description: "Einem Portal einen neuen Namen geben; die Verbindung bleibt"
        args:
          name: PORTAL
          newname: NEUER_NAME

      pause:
        name: pausieren
        aliases: []
        description: "Portal für Wartung pausieren, ohne die Verbindung zu entfernen"
        args:
          name: PORTAL

      resume:
        name: fortsetzen
        aliases: []
        description: "Ein pausiertes Portal wieder öffnen"
        args:
          name: PORTAL

      home:
        name: home
        aliases: []
        description: "Ein Portal zu einem deiner Zuhause öffnen"
        args:
          home: "ZUHAUSE"

      sethome:
        name: sethome
        aliases: []
        description: "Ein Zuhause hier setzen"
        args:
          home: "ZUHAUSE"

      delhome:
        name: delhome
        aliases: []
        description: "Ein Zuhause löschen"
        args:
          home: "ZUHAUSE"

      homes:
        name: homes
        aliases: []
        description: "Deine Zuhause auflisten"

      warp:
        name: warp
        aliases: []
        description: "Ein Portal zu einem Warp öffnen"
        args:
          warp: "WARP"

      setwarp:
        name: setwarp
        aliases: []
        description: "Einen Warp hier setzen (Admins)"
        args:
          warp: "WARP"

      delwarp:
        name: delwarp
        aliases: []
        description: "Einen Warp löschen (Admins)"
        args:
          warp: "WARP"

      warps:
        name: warps
        aliases: []
        description: "Die Warps auflisten"

      energy:
        name: energie
        aliases: []
        description: "Deine Portalenergie anzeigen"
      import:
        name: import
        aliases: []
        description: "Zuhause und Warps aus HuskHomes übernehmen (Admins)"
        args:
          source: SOURCE
  home:
    description: "Ein Portal zu einem deiner Zuhause öffnen"
    aliases: []
    args:
      home: "ZUHAUSE"
  sethome:
    description: "Ein Zuhause hier setzen"
    aliases: []
    args:
      home: "ZUHAUSE"
  delhome:
    description: "Ein Zuhause löschen"
    aliases: []
    args:
      home: "ZUHAUSE"
  homes:
    description: "Deine Zuhause auflisten"
    aliases: []
  warp:
    description: "Ein Portal zu einem Warp öffnen"
    aliases: []
    args:
      warp: "WARP"
  setwarp:
    description: "Einen Warp hier setzen (Admins)"
    aliases: []
    args:
      warp: "WARP"
  delwarp:
    description: "Einen Warp löschen (Admins)"
    aliases: []
    args:
      warp: "WARP"
  warps:
    description: "Die Warps auflisten"
    aliases: []
