# Every switch below applies at once when it is changed in /vadmin features or /vadmin config (1.24.0). Only
# travel-gates.short-commands and tutorial.enabled need a server restart.

# Manual portals (1.24.0): portals made with /vportal create, the view through them, travel, entity travel and the
# /vportal portal commands. false: none of this runs, the commands answer "This feature is switched off on this
# server." and the portal menu is gone; portals.yml, styles and hours are kept.
manual-portals:
  enabled: true

# Skip manual warmups and set native Nether survival/creative dwell time to zero.
# Applies to all loaded worlds; previous gamerules are restored on normal disable.
# World changes may still show Minecraft's loading screen.
instant-travel: true

# Native Minecraft End portals: vanilla owns all transitions.
end-portals:
  enabled: true
  return-view: true
  # Bounded asynchronous 3x3 target loading.
  # Prepare the native arrival platform only if its entire volume is empty.
  prepare-arrival-platform: true
  generate-destination-chunks: true
  # End gateways become a one-block window onto their exit once the exit is known (after the first trip).
  gateways: true
# Texts: plugins/VystormPortals/lang/en.yml and de.yml (Vystorm Core language system, player language).
# Texts that you changed under "messages:" in older versions keep working and win over the language files.

# Native lit Nether portals automatically receive a visual view and a prepared counterpart.
nether-portals:
  enabled: true
  prepare-counterpart: true
# Optional target world names for multiworld plugins, keyed by source-world UUID.
# world-links:
#   <source-world-uuid>:
#     nether: world_nether
#     end: world_the_end
#     overworld: world
world-links: {}
# Use the world-links above (1.24.0). false: native portal views use the vanilla world pairs; the links stay saved.
use-world-links: true

# Items, XP orbs, TNT, falling blocks, arrows/snowballs/ender pearls, mobs and empty minecarts/boats
# fly through PUBLIC manual portals (both ends public) and keep their momentum. Players are unaffected.
# Destinations must be loaded (they are while someone looks through the portal); otherwise the entity just passes the frame.
# Ender dragon, wither and fishing hooks never travel. Needs manual-portals.enabled.
entity-travel:
  enabled: true
  objects: true
  projectiles: true
  mobs: true
  vehicles: true
  max-per-tick: 16

# Portal menu (1.6.0): /vportal menu and an entry in Core's /vmenu (World). Lists every portal you may use;
# owners and admins switch access, link, unlink, change the warmup, delete and create portals there.
menu:
  enabled: true

# Trusted players (1.6.0): owners let single players use a private portal (/vportal trust NAME PLAYER).
# max-per-portal: 1 to 64. player-menu: "Portal access" entry in the Core player menu (sneak + right-click a player).
# enabled: false ignores saved trust lists but keeps them in portals.yml.
trust:
  enabled: true
  max-per-portal: 16
  player-menu: true

# Multi-stop trips over 2 to 8 portals (/vportal trip, 1.24.0 switch). false: the trip commands answer that the
# feature is off and no new trip starts; saved trips stay. Needs manual-portals.enabled.
trips:
  enabled: true

# Portal designer (1.24.0 switch): frame particles, ambient sound and arrival effect per portal, and the Style page
# of the portal menu. false: no particles, sounds or arrival effects and no Style page; styles.yml is kept.
designer:
  enabled: true

# Maintenance mode per portal (/vportal pause and resume, 1.24.0 switch). false: pause flags are ignored (every linked
# portal is open) and pause/resume answer that the feature is off; the flags stay saved.
maintenance:
  enabled: true

# Import of homes and warps from HuskHomes (/vportal import huskhomes, 1.24.0 switch).
import:
  enabled: true

# Portals tutorial in the Vystorm Core main menu (1.24.0). A change needs a server restart.
tutorial:
  enabled: true

# Timed portals: owners set opening hours per portal in the portal menu (days of the week and a daily time window,
# also past midnight). Outside them the portal refuses travel and tells the next opening time; players near a timed
# portal see a countdown in the action bar. Portals without hours are always open.
opening-hours:
  enabled: true
  # Time zone for the hours, e.g. Europe/Berlin; empty = the server's time zone.
  timezone: ""

# Travel gates (1.21.0): /home and /warp open a door-sized (1x2) portal in the wall in front of you – or free
# standing when there is no wall – that shows the destination.
# Walk into the space to travel; after lifetime-seconds the gate breaks down. Home gates are only for their opener;
# warp gates also take along everybody who may use that warp (take-others-along). Gates are never saved.
# Commands: /vportal home|sethome|delhome|homes|warp|setwarp|delwarp|warps|energy, and with short-commands also
# /home, /sethome, /delhome, /homes, /warp, /setwarp, /delwarp, /warps (turn off if another plugin owns them).
travel-gates:
  enabled: true
  short-commands: true
  lifetime-seconds: 10
  # Seconds between two gates of one player (vystormportals.energy.bypass skips it).
  cooldown-seconds: 3
  homes:
    # Home gates (/home, /sethome, /delhome, /homes, 1.24.0 switch). false: they answer that the feature is off;
    # saved homes stay.
    enabled: true
    # Homes per player; permission vystormportals.homes.N (1..100) allows more.
    max: 3
  warps:
    # Warp gates (/warp, /warps, /setwarp, /delwarp, 1.24.0 switch). false: they answer that the feature is off;
    # saved warps stay.
    enabled: true
    take-others-along: true
    # true = every warp needs vystormportals.warp.NAME (or vystormportals.warp.*).
    permission-per-warp: false
  # Portal energy: players have up to max energy that recharges over time (also offline). A gate costs
  # base-cost + cost-per-100-blocks for every 100 blocks of distance, or base-cost + other-world-cost into another
  # world – never more than max, so a full bar always opens one gate. Unused gates give their energy back.
  energy:
    enabled: false
    max: 100
    recharge-per-minute: 5
    base-cost: 5
    cost-per-100-blocks: 1
    other-world-cost: 25
